    <link rel="stylesheet" href="css/style.css">

<body>

    <!-- ── Navbar ── -->
    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">

                    <rect x="22" y="38" width="56" height="24" rx="7" fill="white"/>

                    <ellipse cx="37" cy="42" rx="5" ry="4" fill="#4a9b7f"/>
                    <ellipse cx="46" cy="37" rx="5" ry="4" fill="#4a9b7f"/>

    <!-- ── Contenido principal ── -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Registro de Dueños</h2>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">Volver al Inicio</a>
        </div>

        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4">Registro de Propietario</h3>
            <form id="formDuenos">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="id_dueno">Identificación (ID)</label>
                        <input type="text" id="id_dueno" class="form-control" placeholder="Ej: 601230456" required>
                    </div>
                    <div class="col-md-6">
                        <label for="nombre_dueno">Nombre Completo</label>
                        <input type="text" id="nombre_dueno" class="form-control" placeholder="Nombre y Apellidos" required>
                    </div>
                    <div class="col-md-6">
                        <label for="tel_dueno">Teléfono</label>
                        <input type="tel" id="tel_dueno" class="form-control" placeholder="8888-8888" required>
                    </div>
                    <div class="col-md-6">
                        <label for="correo_dueno">Correo Electrónico</label>
                        <input type="email" id="correo_dueno" class="form-control" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="col-12">
                        <label for="direccion_dueno">Dirección</label>
                        <input type="text" id="direccion_dueno" class="form-control" placeholder="Provincia, cantón, distrito..." required>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-5">Guardar Dueño</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Tabla de registros -->
        <div class="card shadow-sm p-4 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Dueños Registrados</h4>
                <input type="text" id="buscar_dueno" class="form-control w-auto" placeholder="🔍 Buscar...">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tablaDuenos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Correo</th>
                            <th>Dirección</th>
                        </tr>
                    </thead>
                    <tbody id="bodyDuenos">
                        <tr id="sinRegistros">
                            <td colspan="5" class="text-center text-muted py-4">No hay dueños registrados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="py-5">
        <div class="container text-center">
            <p class="text-muted mb-0 small">&copy; 2026 Vet-Care Clínica Veterinaria</p>
            <p class="text-muted small">El Roble, Puntarenas</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ── Cargar tabla al iniciar ──
        window.addEventListener('load', cargarTabla);

        function cargarTabla(filtro = '') {
            const duenos = JSON.parse(localStorage.getItem('vc_duenos') || '[]');
            const tbody  = document.getElementById('bodyDuenos');
            const sinReg = document.getElementById('sinRegistros');
            tbody.innerHTML = '';

            const filtrados = duenos.filter(d =>
                d.nombre.toLowerCase().includes(filtro.toLowerCase()) ||
                d.id.includes(filtro) ||
                d.correo.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No hay resultados.</td></tr>`;
                return;
            }

            filtrados.forEach(d => {
                tbody.innerHTML += `
                    <tr>
                        <td>${d.id}</td>
                        <td>${d.nombre}</td>
                        <td>${d.tel}</td>
                        <td>${d.correo}</td>
                        <td>${d.direccion}</td>
                    </tr>`;
            });
        }

        // ── Buscar ──
        document.getElementById('buscar_dueno').addEventListener('input', function () {
            cargarTabla(this.value);
        });

        // ── Guardar dueño ──
        document.getElementById('formDuenos').addEventListener('submit', function (e) {
            e.preventDefault();
            const duenos = JSON.parse(localStorage.getItem('vc_duenos') || '[]');
            const nuevo = {
                id:        document.getElementById('id_dueno').value.trim(),
                nombre:    document.getElementById('nombre_dueno').value.trim(),
                tel:       document.getElementById('tel_dueno').value.trim(),
                correo:    document.getElementById('correo_dueno').value.trim(),
                direccion: document.getElementById('direccion_dueno').value.trim()
            };
            duenos.push(nuevo);
            localStorage.setItem('vc_duenos', JSON.stringify(duenos));
            this.reset();
            cargarTabla();
        });
    </script>
</body>
</html>
