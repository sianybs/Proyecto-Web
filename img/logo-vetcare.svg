<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">

  <!-- Círculo de fondo del ícono -->
  <circle cx="50" cy="50" r="44" fill="#4a9b7f"/>

  <!-- Cruz veterinaria blanca -->
  <rect x="38" y="22" width="24" height="56" rx="7" fill="white"/>
  <rect x="22" y="38" width="56" height="24" rx="7" fill="white"/>

  <!-- Patita encima (almohadilla central) -->
  <ellipse cx="50" cy="52" rx="9" ry="7" fill="#4a9b7f"/>
  <!-- 4 deditos -->
  <ellipse cx="37" cy="42" rx="5" ry="4" fill="#4a9b7f"/>
  <ellipse cx="46" cy="37" rx="5" ry="4" fill="#4a9b7f"/>
  <ellipse cx="56" cy="37" rx="5" ry="4" fill="#4a9b7f"/>
  <ellipse cx="65" cy="42" rx="5" ry="4" fill="#4a9b7f"/>

  <!-- Texto "Vet-Care" -->
  <text
    x="112" y="58"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="700"
    fill="#1e2d27"
    letter-spacing="-0.5"
  >Vet-Care</text>

  <!-- Subtítulo -->
  <text
    x="113" y="78"
    font-family="Arial, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#6b7f76"
    letter-spacing="3.5"
  >CLÍNICA VETERINARIA</text>

  <!-- Línea decorativa -->
  <line x1="113" y1="84" x2="360" y2="84" stroke="#d4e8df" stroke-width="1.5" stroke-linecap="round"/>

</svg>
