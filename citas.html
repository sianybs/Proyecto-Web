    <!-- ── Contenido principal ── -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Citas</h2>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">Volver al Inicio</a>
        </div>

        <!-- __ Formulario de nueva cita __ -->
        <div class="card shadow-sm p-4 mb-5" style="border-radius: 40px;">
            <h3 class="text-center mb-4">Agendar Nueva Cita</h3>
            <form id="formCitas">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="select_dueno">Seleccionar Dueño por ID</label>
                        <select id="select_dueno" class="form-control">
                            <option value="">-- Seleccione un dueño --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="select_mascota">Seleccionar Paciente</label>
                        <select id="select_mascota" class="form-control">
                            <option value="">-- Seleccione una mascota --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="fecha_cita">Fecha</label>
                        <input type="date" id="fecha_cita" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label for="hora_cita">Hora</label>
                        <input type="time" id="hora_cita" class="form-control">
                    </div>
                    <div class="col-md-12">
                        <label for="motivo_cita">Motivo de la Cita</label>
                        <textarea id="motivo_cita" class="form-control" rows="3" placeholder="Ej: Vacunación, Revisión general, etc."></textarea>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-5 shadow-sm">Agendar Cita</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- __ Tabla de citas __ -->
        <div class="card shadow-sm p-4" style="border-radius: 40px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Citas Agendadas</h4>
                <input type="text" id="buscar_cita" class="form-control w-auto" placeholder="🔍 Buscar...">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tablaCitas">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Mascota</th>
                            <th>Dueño</th>
                            <th>Motivo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody_citas">
                        <tr>
                            <td colspan="6" class="text-center text-muted">No hay citas agendadas</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="py-5">
