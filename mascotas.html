                    <ellipse cx="37" cy="42" rx="5" ry="4" fill="#4a9b7f"/>

    <!-- ── Contenido principal ── -->
    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Registro de Mascotas</h2>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">Volver al Inicio</a>
        </div>

        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-4">Registro de Mascota</h3>
            <form id="formMascotas">
                <div class="row g-3">

                    <div class="col-md-12">
                        <label for="select_dueno">Dueño Responsable</label>
                        <select id="select_dueno" class="form-control">
                            <option value="">Seleccione un dueño...</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="nombre_mascota">Nombre de la Mascota</label>
                        <input type="text" id="nombre_mascota" class="form-control" placeholder="Ej: Max, Luna...">
                    </div>

                    <div class="col-md-6">
                        <label for="raza_mascota">Raza / Especie</label>
                        <input type="text" id="raza_mascota" class="form-control" placeholder="Ej: Labrador, Siamés...">
                    </div>

                    <div class="col-md-6">
                        <label for="color_mascota">Color</label>
                        <input type="text" id="color_mascota" class="form-control" placeholder="Ej: Café, Blanco y negro...">
                    </div>

                    <div class="col-md-6">
                        <label for="categoria_mascota">Categoría</label>
                        <select id="categoria_mascota" class="form-control">
                            <option value="">Seleccionar...</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave">Ave</option>
                            <option value="Reptil">Reptil</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="edad_mascota">Edad (años)</label>
                        <input type="number" id="edad_mascota" class="form-control" placeholder="Ej: 3" min="0" max="30">
                    </div>

                    <div class="col-md-6">
                        <label for="peso_mascota">Peso (kg)</label>
                        <input type="number" id="peso_mascota" class="form-control" placeholder="Ej: 5.5" step="0.1" min="0">
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-primary px-5">Registrar Mascota</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Tabla de mascotas -->
        <div class="card shadow-sm p-4 mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Mascotas Registradas</h4>
                <input type="text" id="buscar_mascota" class="form-control w-auto" placeholder="🔍 Buscar...">
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="tablaMascotas">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Raza</th>
                            <th>Color</th>
                            <th>Edad</th>
                            <th>Peso</th>
                            <th>Dueño</th>
                        </tr>
                    </thead>
                    <tbody id="bodyMascotas">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">No hay mascotas registradas aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="py-5">
        <div class="container text-center">

        }

</body>
</html>
